<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Güvercin Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      background: #00a884;
      margin: 0;
      padding: 0;

      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;

      background: #efeae2;

      display: flex;
      overflow: hidden;
    }

    @media (min-width: 769px) {
      body {
        background: #d1d7db;
      }

      .app-container {
        max-width: 950px;
        height: 90vh;

        border-radius: 12px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .back-btn {
        display: none !important;
      }
    }

    /* =========================
       GİRİŞ
    ========================= */

    .login-overlay {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #f0f2f5;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 100;

      padding: 20px;
    }

    .login-card {
      background: white;

      width: 100%;
      max-width: 360px;

      padding: 30px 24px;

      border-radius: 16px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .login-avatar {
      width: 70px;
      height: 70px;

      background: #e8f5e9;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 34px;

      margin: 0 auto 15px auto;
    }

    .login-title {
      font-size: 20px;
      color: #111b21;

      font-weight: 600;

      margin-bottom: 6px;
    }

    .login-desc {
      font-size: 13px;
      color: #667781;

      margin-bottom: 22px;

      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;

      margin-bottom: 6px;

      font-size: 11px;

      color: #00a884;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.5px;
    }

    .login-card input {
      width: 100%;

      padding: 12px 14px;

      border: 1.5px solid #e0e0e0;

      border-radius: 8px;

      font-size: 16px;

      outline: none;
    }

    .login-card input:focus {
      border-color: #00a884;
    }

    .login-card button {
      width: 100%;

      padding: 14px;

      background: #00a884;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: 600;

      font-size: 16px;

      cursor: pointer;

      margin-top: 5px;
    }

    .location-status {
      margin-top: 14px;

      font-size: 12px;

      color: #667781;

      line-height: 1.4;
    }

    /* =========================
       SOL PANEL
    ========================= */

    .sidebar {
      width: 320px;

      background: #ffffff;

      border-right: 1px solid #e0e0e0;

      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      background: #008069;

      color: white;

      padding: 16px;

      font-weight: bold;

      font-size: 17px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .add-contact-box {
      padding: 10px;

      background: #f0f2f5;

      border-bottom: 1px solid #e0e0e0;

      display: flex;

      gap: 8px;
    }

    .add-contact-box input {
      flex: 1;

      padding: 10px 12px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 14px;

      outline: none;
    }

    .add-contact-box button {
      background: #00a884;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      padding: 0 16px;

      font-size: 18px;

      cursor: pointer;
    }

    .contact-list {
      flex: 1;

      overflow-y: auto;
    }

    .contact-item {
      padding: 14px 16px;

      border-bottom: 1px solid #f0f0f0;

      cursor: pointer;
    }

    .contact-item:active {
      background: #e9edef;
    }

    .contact-item.active {
      background: #f0f2f5;

      font-weight: bold;
    }

    .contact-phone {
      font-size: 15px;

      color: #111b21;
    }

    .contact-last-msg {
      font-size: 13px;

      color: #667781;

      margin-top: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* =========================
       SOHBET
    ========================= */

    .chat-area {
      flex: 1;

      display: flex;

      flex-direction: column;

      background: #efeae2;
    }

    .chat-header {
      background: #f0f2f5;

      padding: 10px 14px;

      border-bottom: 1px solid #e0e0e0;

      display: flex;

      align-items: center;

      gap: 10px;

      height: 60px;
    }

    .back-btn {
      font-size: 22px;

      cursor: pointer;

      padding: 4px 8px;

      color: #00a884;

      font-weight: bold;
    }

    .chat-header-title {
      font-weight: bold;

      color: #111b21;

      font-size: 16px;
    }

    .chat-header-sub {
      font-size: 12px;

      color: #667781;
    }

    .chat-body {
      flex: 1;

      overflow-y: auto;

      padding: 15px;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .msg-bubble {
      max-width: 80%;

      padding: 8px 12px;

      border-radius: 8px;

      font-size: 15px;

      word-wrap: break-word;

      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .msg-outgoing {
      background: #dcf8c6;

      align-self: flex-end;

      border-top-right-radius: 0;
    }

    .msg-incoming {
      background: #ffffff;

      align-self: flex-start;

      border-top-left-radius: 0;
    }

    .msg-info {
      font-size: 11px;

      color: #666;

      margin-top: 4px;

      text-align: right;

      display: flex;

      justify-content: flex-end;

      gap: 4px;
    }

    .system-banner {
      background: #fff3cd;

      color: #856404;

      padding: 10px;

      border-radius: 8px;

      font-size: 13px;

      text-align: center;

      border: 1px solid #ffeeba;

      margin-bottom: 10px;
    }

    .chat-footer {
      background: #f0f2f5;

      padding: 8px 10px;

      display: flex;

      gap: 8px;

      align-items: center;
    }

    .chat-footer input {
      flex: 1;

      border-radius: 20px;

      border: none;

      padding: 12px 16px;

      font-size: 15px;

      outline: none;
    }

    .chat-footer button {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: #00a884;

      color: white;

      border: none;

      font-size: 18px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-shrink: 0;

      cursor: pointer;
    }

    .chat-footer button:disabled {
      background: #a5d6a7;

      cursor: not-allowed;
    }

    .empty-state {
      display: flex;

      flex: 1;

      justify-content: center;

      align-items: center;

      color: #667781;

      font-size: 15px;

      text-align: center;

      padding: 20px;
    }

    /* =========================
       MOBİL
    ========================= */

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
      }

      .chat-area {
        width: 100%;

        display: none;
      }

      .app-container.show-chat .sidebar {
        display: none;
      }

      .app-container.show-chat .chat-area {
        display: flex;
      }
    }
  </style>
</head>

<body>

<div id="app-container" class="app-container">

  <!-- =========================
       GİRİŞ EKRANI
  ========================= -->

  <div id="login-overlay" class="login-overlay">

    <div class="login-card">

      <div class="login-avatar">🕊️</div>

      <div class="login-title">
        Güvercin Messenger
      </div>

      <div class="login-desc">
        Güvercinlerin doğru adrese uçabilmesi için
        telefon numaranızı ve konumunuzu kullanıyoruz.
      </div>

      <div class="input-group">

        <label>
          Telefon Numarası
        </label>

        <input
          id="my-phone"
          type="tel"
          placeholder="05XXXXXXXXX"
          maxlength="11"
          autocomplete="tel"
        />

      </div>

      <button
        id="login-button"
        onclick="login()"
      >
        Giriş Yap
      </button>

      <div
        id="location-status"
        class="location-status"
      >
         🇹🇷 Muhammed Fatih Uğurlu 🇹🇷
      </div>

    </div>

  </div>


  <!-- =========================
       SOL PANEL
  ========================= -->

  <div class="sidebar">

    <div class="sidebar-header">

      <span>
        🕊️ Güvercin
      </span>

      <span
        id="my-phone-display"
        style="font-size:12px; opacity:0.9;"
      ></span>

    </div>


    <div class="add-contact-box">

      <input
        id="new-contact-phone"
        type="tel"
        placeholder="Kişi ekle (05XXXXXXXXX)"
        maxlength="11"
      />

      <button onclick="addNewContact()">
        +
      </button>

    </div>


    <div
      id="contact-list"
      class="contact-list"
    ></div>

  </div>


  <!-- =========================
       SOHBET ALANI
  ========================= -->

  <div class="chat-area">

    <div class="chat-header">

      <div
        class="back-btn"
        onclick="backToContacts()"
      >
        ←
      </div>

      <div>

        <div
          id="active-contact-title"
          class="chat-header-title"
        >
          Sohbet Seçin
        </div>

        <div
          id="active-contact-sub"
          class="chat-header-sub"
        >
          Sol taraftan bir numara seçin
        </div>

      </div>

    </div>


    <div
      id="chat-body"
      class="chat-body"
    >

      <div
        id="system-banner"
        class="system-banner"
        style="display:none;"
      ></div>

      <div
        id="empty-state"
        class="empty-state"
      >
        Mesajlaşmak için bir sohbet seçin
      </div>

    </div>


    <div class="chat-footer">

      <input
        id="message-text"
        placeholder="Bir mesaj yazın..."
        onkeypress="handleKeyPress(event)"
        disabled
      />

      <button
        id="send-btn"
        onclick="sendPigeon()"
        disabled
      >
        🕊️
      </button>

    </div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

  /* =========================
     SOCKET
  ========================= */

  const socket = io();


  /* =========================
     DEĞİŞKENLER
  ========================= */

  let myPhone = '';

  let activeContact = null;

  let allMessages = [];

  let contacts = new Set();

  let myLat = null;

  let myLng = null;

  let locationWatchId = null;

  let pigeonBusy = false;


  /* =========================
     TELEFON KONTROLÜ
  ========================= */

  function isValidPhone(phone) {

    return /^05[0-9]{9}$/.test(phone);

  }


  /* =========================
     GİRİŞ
  ========================= */

  function login() {

    const input =
      document.getElementById('my-phone');

    const phone =
      input.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }


    myPhone = phone;


    const status =
      document.getElementById('location-status');

    const button =
      document.getElementById('login-button');


    button.disabled = true;

    button.innerText =
      '🇹🇷Fatihin Güvercini hazırlanıyor...🇹🇷';

    /* =========================
       KONUM KONTROLÜ
    ========================= */

    if (!navigator.geolocation) {

      button.disabled = false;

      button.innerText =
        'Giriş Yap';

      status.innerText =
        '❌ Bu tarayıcı konum özelliğini desteklemiyor.';

      return;

    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        myLat =
          position.coords.latitude;

        myLng =
          position.coords.longitude;


        console.log(
          '📍 Gerçek konum:',
          myLat,
          myLng
        );


        


        /* =========================
           SERVER'A GİRİŞ
        ========================= */

        socket.emit('login', {

          phoneNumber: myPhone,

          latitude: myLat,

          longitude: myLng

        });


        /* =========================
           KONUMU TAKİP ET
        ========================= */

        startLocationTracking();

      },


function(error) {

  console.error(
    'Konum hatası:',
    error
  );

  button.disabled = false;
  button.innerText = 'Giriş Yap';

  status.innerText =
    '⚠️ Konum verilmedi. Konumsuz giriş yapılıyor...';

  socket.emit('login', {
    phoneNumber: myPhone,
    latitude: null,
    longitude: null
  });

},
{
  enableHighAccuracy: true,
  timeout: 15000,
  maximumAge: 0
}
);
  }


  /* =========================
     KONUM TAKİBİ
  ========================= */

  function startLocationTracking() {

    if (!navigator.geolocation) {
      return;
    }


    if (locationWatchId !== null) {

      navigator.geolocation.clearWatch(
        locationWatchId
      );

    }


    locationWatchId =
      navigator.geolocation.watchPosition(

        function(position) {

          myLat =
            position.coords.latitude;

          myLng =
            position.coords.longitude;


          console.log(
            '📍 Konum güncellendi:',
            myLat,
            myLng
          );


          socket.emit(
            'update location',
            {

              latitude: myLat,

              longitude: myLng

            }
          );

        },

        function(error) {

          console.log(
            'Konum takip hatası:',
            error.message
          );

        },

        {

          enableHighAccuracy: true,

          maximumAge: 30000,

          timeout: 15000

        }

      );

  }


  /* =========================
     GİRİŞ BAŞARILI
  ========================= */

  socket.on(
    'login success',
    function(data) {

      console.log(
        '✅ Giriş başarılı:',
        data
      );


      document.getElementById(
        'login-overlay'
      ).style.display = 'none';


      document.getElementById(
        'my-phone-display'
      ).innerText =
        data.phoneNumber;


      allMessages =
        data.history || [];


      /* =========================
         MESAJLARDAN KİŞİLERİ BUL
      ========================= */

      allMessages.forEach(
        function(message) {

          const other =
            message.senderPhone === myPhone
              ? message.receiverPhone
              : message.senderPhone;


          if (other) {

            contacts.add(other);

          }

        }
      );


      renderContacts();


      if (data.pigeonState === 'busy') {

        pigeonBusy = true;

        setSendButtonState(false);

      }

      else {

        pigeonBusy = false;

      }

    }
  );


  /* =========================
     GİRİŞ HATASI
  ========================= */

  socket.on(
    'login failed',
    function(data) {

      alert(
        data.message || 'Giriş başarısız.'
      );

    }
  );


  /* =========================
     GÜVERCİN HATASI
  ========================= */

  socket.on(
    'pigeon error',
    function(data) {

      pigeonBusy = false;

      setSendButtonState(true);

      alert(
        data.message
      );

    }
  );


  /* =========================
     KİŞİ EKLE
  ========================= */

  function addNewContact() {

    const input =
      document.getElementById(
        'new-contact-phone'
      );


    const phone =
      input.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }


    if (phone === myPhone) {

      alert(
        'Kendi numaranızı ekleyemezsiniz!'
      );

      return;

    }


    contacts.add(phone);


    input.value = '';


    renderContacts();

    selectContact(phone);

  }


  /* =========================
     KİŞİLERİ GÖSTER
  ========================= */

  function renderContacts() {

    const list =
      document.getElementById(
        'contact-list'
      );


    list.innerHTML = '';


    contacts.forEach(
      function(phone) {

        const item =
          document.createElement('div');


        item.className =
          `contact-item ${
            phone === activeContact
              ? 'active'
              : ''
          }`;


        item.onclick =
          function() {

            selectContact(phone);

          };


        const lastMsg =
          allMessages

            .filter(
              function(message) {

                return (

                  (
                    message.senderPhone === myPhone &&
                    message.receiverPhone === phone
                  )

                  ||

                  (
                    message.senderPhone === phone &&
                    message.receiverPhone === myPhone
                  )

                );

              }
            )

            .pop();


        item.innerHTML = `

          <div class="contact-phone">
            ${escapeHtml(phone)}
          </div>

          <div class="contact-last-msg">
            ${
              lastMsg
                ? escapeHtml(lastMsg.message)
                : 'Henüz mesaj yok'
            }
          </div>

        `;


        list.appendChild(item);

      }
    );

  }


  /* =========================
     SOHBET SEÇ
  ========================= */

  function selectContact(phone) {

    activeContact = phone;


    document.getElementById(
      'active-contact-title'
    ).innerText = phone;


    document.getElementById(
      'active-contact-sub'
    ).innerText =
      '🕊️ Güvercin Postası Aktif';


    document.getElementById(
      'message-text'
    ).disabled = false;


    if (!pigeonBusy) {

      document.getElementById(
        'send-btn'
      ).disabled = false;

    }


    document.getElementById(
      'app-container'
    ).classList.add('show-chat');


    renderContacts();

    renderActiveChat();

  }


  /* =========================
     GERİ
  ========================= */

  function backToContacts() {

    document.getElementById(
      'app-container'
    ).classList.remove(
      'show-chat'
    );

  }


  /* =========================
     SOHBETİ GÖSTER
  ========================= */

  function renderActiveChat() {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    chatBody.innerHTML = `

      <div
        id="system-banner"
        class="system-banner"
        style="display:none;"
      ></div>

    `;


    if (!activeContact) {

      chatBody.innerHTML += `

        <div
          id="empty-state"
          class="empty-state"
        >
          Mesajlaşmak için bir sohbet seçin
        </div>

      `;

      return;

    }


    const filtered =
      allMessages.filter(
        function(message) {

          return (

            (
              message.senderPhone === myPhone &&
              message.receiverPhone === activeContact
            )

            ||

            (
              message.senderPhone === activeContact &&
              message.receiverPhone === myPhone
            )

          );

        }
      );


    filtered.forEach(
      appendMessageToBody
    );

  }


  /* =========================
     MESAJ GÖSTER
  ========================= */

  function appendMessageToBody(msg) {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    const emptyState =
      document.getElementById(
        'empty-state'
      );


    if (emptyState) {

      emptyState.remove();

    }


    const isOutgoing =
      msg.senderPhone === myPhone;


    const bubble =
      document.createElement('div');


    bubble.className =
      `msg-bubble ${
        isOutgoing
          ? 'msg-outgoing'
          : 'msg-incoming'
      }`;


    bubble.innerHTML = `

      <div>
        ${escapeHtml(msg.message)}
      </div>

      <div class="msg-info">

        <span>
          📍 ${escapeHtml(
            String(msg.distance)
          )} km
        </span>

        <span>•</span>

        <span>
          ${escapeHtml(
            String(msg.time)
          )}
        </span>

        ${
          isOutgoing
            ? '<span>🕊️</span>'
            : ''
        }

      </div>

    `;


    chatBody.appendChild(
      bubble
    );


    chatBody.scrollTop =
      chatBody.scrollHeight;

  }


  /* =========================
     GÜVERCİN GÖNDER
  ========================= */

  function sendPigeon() {

    if (!activeContact) {

      alert(
        'Lütfen sohbet edilecek kişiyi seçin!'
      );

      return;

    }


    if (pigeonBusy) {

      alert(
        'Güvercinin şu anda yolda! 🕊️'
      );

      return;

    }


    if (
      myLat === null ||
      myLng === null
    ) {

      alert(
        'Konumunuz henüz alınmadı. Lütfen konum iznini açıp tekrar giriş yapın.'
      );

      return;

    }


    const messageInput =
      document.getElementById(
        'message-text'
      );


    const message =
      messageInput.value.trim();


    if (!message) {

      return;

    }


    /* =========================
       SUNUCUYA MESAJ
       GERÇEK KONUMU SUNUCU BULACAK
    ========================= */

    socket.emit(
      'send pigeon',
      {

        senderPhone: myPhone,

        receiverPhone: activeContact,

        message: message

      }
    );


    messageInput.value = '';

  }


  /* =========================
     ENTER
  ========================= */

  function handleKeyPress(e) {

    if (e.key === 'Enter') {

      sendPigeon();

    }

  }


  /* =========================
     BUTON DURUMU
  ========================= */

  function setSendButtonState(enabled) {

    const button =
      document.getElementById(
        'send-btn'
      );


    button.disabled =
      !enabled;

  }


  /* =========================
     GÜVERCİN YOLA ÇIKTI
  ========================= */

  socket.on(
    'pigeon status',
    function(data) {

      console.log(
        '🕊️ Güvercin yola çıktı:',
        data
      );


      allMessages.push(
        data.messageData
      );


      if (
        activeContact ===
        data.receiverPhone
      ) {

        appendMessageToBody(
          data.messageData
        );

      }


      renderContacts();


      pigeonBusy = true;

      setSendButtonState(false);


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (!banner) {
        return;
      }


      banner.style.display =
        'block';


      let timeLeft =
        data.flightTimeInSeconds;


      function updateTimer() {

        if (timeLeft <= 0) {

          banner.innerText =
            `🕊️ Güvercin teslimat noktasına ulaştı.`;

          return;

        }


        const minutes =
          Math.floor(
            timeLeft / 60
          );


        const seconds =
          timeLeft % 60;


        let remainingText;


        if (minutes > 0) {

          remainingText =
            `${minutes} dk ${seconds} sn`;

        }

        else {

          remainingText =
            `${seconds} sn`;

        }


        banner.innerText =
          `🕊️ Güvercin yolda... ` +
          `Kalan: ${remainingText} ` +
          `(${data.distance} km)`;


        timeLeft--;

        setTimeout(
          updateTimer,
          1000
        );

      }


      updateTimer();

    }
  );


  /* =========================
     TESLİM EDİLDİ
  ========================= */

  socket.on(
    'pigeon delivered',
    function(data) {

      pigeonBusy = false;


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (banner) {

        banner.innerText =
          data.message;

        banner.style.display =
          'block';

      }


      setSendButtonState(
        activeContact !== null
      );


      setTimeout(
        function() {

          if (banner) {

            banner.style.display =
              'none';

          }

        },
        4000
      );

    }
  );


  /* =========================
     GÜVERCİN GELDİ
  ========================= */

  socket.on(
    'pigeon arrived',
    function(msgData) {

      console.log(
        '📬 Mesaj geldi:',
        msgData
      );


      allMessages.push(
        msgData
      );


      contacts.add(
        msgData.senderPhone
      );


      if (
        activeContact ===
        msgData.senderPhone
      ) {

        appendMessageToBody(
          msgData
        );

      }


      renderContacts();

    }
  );


  /* =========================
     GÜVENLİ HTML
  ========================= */

  function escapeHtml(value) {

    return String(value)

      .replaceAll('&', '&amp;')

      .replaceAll('<', '&lt;')

      .replaceAll('>', '&gt;')

      .replaceAll('"', '&quot;')

      .replaceAll("'", '&#039;');

  }


  /* =========================
     TELEFONDAN ENTER
  ========================= */

  document
    .getElementById('my-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          login();

        }

      }
    );


  document
    .getElementById('new-contact-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          addNewContact();

        }

      }
    );


</script>
