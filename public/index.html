<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Güvercin Messenger</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      background: #00a884;
      margin: 0;
      padding: 0;

      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .app-container {
      position: relative;
      width: 100%;
      height: 100%;

      background: #efeae2;

      display: flex;
      overflow: hidden;
    }

    @media (min-width: 769px) {
      body {
        background: #d1d7db;
      }

      .app-container {
        max-width: 950px;
        height: 90vh;

        border-radius: 12px;

        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
      }

      .back-btn {
        display: none !important;
      }
    }

    /* =========================
       GİRİŞ
    ========================= */

    .login-overlay {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background: #f0f2f5;

      display: flex;
      justify-content: center;
      align-items: center;

      z-index: 100;

      padding: 20px;
    }

    .login-card {
      background: white;

      width: 100%;
      max-width: 360px;

      padding: 30px 24px;

      border-radius: 16px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);

      text-align: center;
    }

    .login-avatar {
      width: 70px;
      height: 70px;

      background: #e8f5e9;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 34px;

      margin: 0 auto 15px auto;
    }

    .login-title {
      font-size: 20px;
      color: #111b21;

      font-weight: 600;

      margin-bottom: 6px;
    }

    .login-desc {
      font-size: 13px;
      color: #667781;

      margin-bottom: 22px;

      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    label {
      display: block;

      margin-bottom: 6px;

      font-size: 11px;

      color: #00a884;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: 0.5px;
    }

    .login-card input {
      width: 100%;

      padding: 12px 14px;

      border: 1.5px solid #e0e0e0;

      border-radius: 8px;

      font-size: 16px;

      outline: none;
    }

    .login-card input:focus {
      border-color: #00a884;
    }

    .login-card button {
      width: 100%;

      padding: 14px;

      background: #00a884;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: 600;

      font-size: 16px;

      cursor: pointer;

      margin-top: 5px;
    }

    .location-status {
      margin-top: 14px;

      font-size: 12px;

      color: #667781;

      line-height: 1.4;
    }

    /* =========================
       SOL PANEL
    ========================= */

    .sidebar {
      width: 320px;

      background: #ffffff;

      border-right: 1px solid #e0e0e0;

      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      background: #008069;

      color: white;

      padding: 14px 16px;

      font-weight: bold;

      font-size: 16px;

      display: flex;

      justify-content: space-between;

      align-items: center;
    }

    .profile-name-box {
      padding: 10px;

      background: #e7f5f0;

      border-bottom: 1px solid #c2e5d9;

      display: flex;

      gap: 8px;

      align-items: center;
    }

    .profile-name-box input {
      flex: 1;

      padding: 8px 10px;

      border: 1px solid #00a884;

      border-radius: 6px;

      font-size: 13px;

      outline: none;
    }

    .profile-name-box button {
      background: #008069;

      color: white;

      border: none;

      border-radius: 6px;

      font-weight: bold;

      padding: 8px 12px;

      font-size: 12px;

      cursor: pointer;
    }

    /* ŞİFRE DEĞİŞTİRME KUTUSU */
    .profile-password-box {
      padding: 10px;

      background: #f4faf8;

      border-bottom: 1px solid #c2e5d9;

      display: flex;

      flex-direction: column;

      gap: 6px;
    }

    .profile-password-box input {
      width: 100%;

      padding: 8px 10px;

      border: 1px solid #00a884;

      border-radius: 6px;

      font-size: 13px;

      outline: none;
    }

    .profile-password-box button {
      background: #008069;

      color: white;

      border: none;

      border-radius: 6px;

      font-weight: bold;

      padding: 8px 12px;

      font-size: 12px;

      cursor: pointer;
    }

    .add-contact-box {
      padding: 10px;

      background: #f0f2f5;

      border-bottom: 1px solid #e0e0e0;

      display: flex;

      gap: 8px;
    }

    .add-contact-box input {
      flex: 1;

      padding: 10px 12px;

      border: 1px solid #ccc;

      border-radius: 8px;

      font-size: 14px;

      outline: none;
    }

    .add-contact-box button {
      background: #00a884;

      color: white;

      border: none;

      border-radius: 8px;

      font-weight: bold;

      padding: 0 16px;

      font-size: 18px;

      cursor: pointer;
    }

    .contact-list {
      flex: 1;

      overflow-y: auto;
    }

    .contact-item {
      padding: 14px 16px;

      border-bottom: 1px solid #f0f0f0;

      cursor: pointer;
    }

    .contact-item:active {
      background: #e9edef;
    }

    .contact-item.active {
      background: #f0f2f5;

      font-weight: bold;
    }

    .contact-name {
      font-size: 15px;

      color: #111b21;

      font-weight: 600;
    }

    .contact-phone {
      font-size: 12px;

      color: #667781;
    }

    .contact-last-msg {
      font-size: 13px;

      color: #667781;

      margin-top: 3px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    /* =========================
       SOHBET
    ========================= */

    .chat-area {
      flex: 1;

      display: flex;

      flex-direction: column;

      background: #efeae2;
    }

    .chat-header {
      background: #f0f2f5;

      padding: 10px 14px;

      border-bottom: 1px solid #e0e0e0;

      display: flex;

      align-items: center;

      gap: 10px;

      height: 60px;
    }

    .back-btn {
      font-size: 22px;

      cursor: pointer;

      padding: 4px 8px;

      color: #00a884;

      font-weight: bold;
    }

    .chat-header-title {
      font-weight: bold;

      color: #111b21;

      font-size: 16px;
    }

    .chat-header-sub {
      font-size: 12px;

      color: #667781;
    }

    .chat-body {
      flex: 1;

      overflow-y: auto;

      padding: 15px;

      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .msg-bubble {
      max-width: 80%;

      padding: 8px 12px;

      border-radius: 8px;

      font-size: 15px;

      word-wrap: break-word;

      box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }

    .msg-sender-name {
      font-size: 11px;
      font-weight: bold;
      color: #008069;
      margin-bottom: 3px;
    }

    .msg-outgoing {
      background: #dcf8c6;

      align-self: flex-end;

      border-top-right-radius: 0;
    }

    .msg-incoming {
      background: #ffffff;

      align-self: flex-start;

      border-top-left-radius: 0;
    }

    .msg-info {
      font-size: 11px;

      color: #666;

      margin-top: 4px;

      text-align: right;

      display: flex;

      justify-content: flex-end;

      gap: 4px;
    }

    .system-banner {
      background: #fff3cd;

      color: #856404;

      padding: 10px;

      border-radius: 8px;

      font-size: 13px;

      text-align: center;

      border: 1px solid #ffeeba;

      margin-bottom: 10px;
    }

    .chat-footer {
      background: #f0f2f5;

      padding: 8px 10px;

      display: flex;

      gap: 8px;

      align-items: center;
    }

    .chat-footer input {
      flex: 1;

      border-radius: 20px;

      border: none;

      padding: 12px 16px;

      font-size: 15px;

      outline: none;
    }

    .chat-footer button {
      width: 44px;
      height: 44px;

      border-radius: 50%;

      background: #00a884;

      color: white;

      border: none;

      font-size: 18px;

      display: flex;

      justify-content: center;

      align-items: center;

      flex-shrink: 0;

      cursor: pointer;
    }

    .chat-footer button:disabled {
      background: #a5d6a7;

      cursor: not-allowed;
    }

    .empty-state {
      display: flex;

      flex: 1;

      justify-content: center;

      align-items: center;

      color: #667781;

      font-size: 15px;

      text-align: center;

      padding: 20px;
    }

    /* =========================
       MOBİL
    ========================= */

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
      }

      .chat-area {
        width: 100%;

        display: none;
      }

      .app-container.show-chat .sidebar {
        display: none;
      }

      .app-container.show-chat .chat-area {
        display: flex;
      }
    }
  </style>
</head>

<body>

<div id="app-container" class="app-container">

  <!-- =========================
       GİRİŞ EKRANI
  ========================= -->

  <div id="login-overlay" class="login-overlay">

    <div class="login-card">

      <div class="login-avatar">🕊️</div>

      <div class="login-title">
        Güvercin Messenger
      </div>

      <div class="login-desc">
        Giriş yapmak veya kayıt olmak için telefon numaranızı ve şifrenizi girin.    🇹🇷Muhammed Fatih Uğurlu🇹🇷
        🇹🇷Muhammed Fatih Uğurlu🇹🇷
      </div>

      <div class="input-group">

        <label>
          Telefon Numarası
        </label>

        <input
          id="my-phone"
          type="tel"
          placeholder="05XXXXXXXXX"
          maxlength="11"
          autocomplete="tel"
        />

      </div>

      <!-- ŞİFRE ALANI -->
      <div class="input-group">

        <label>
          Şifre (4-12 Karakter)
        </label>

        <input
          id="my-password"
          type="password"
          placeholder="Şifrenizi Girin"
          minlength="4"
          maxlength="12"
        />

      </div>

      <button
        id="login-button"
        onclick="login()"
      >
        Giriş Yap / Kayıt Ol
      </button>

      <div
        id="location-status"
        class="location-status"
      >
         🇹🇷 Muhammed Fatih Uğurlu 🇹🇷
      </div>

    </div>

  </div>


  <!-- =========================
       SOL PANEL
  ========================= -->

  <div class="sidebar">

    <div class="sidebar-header">

      <span>
        🕊️ Güvercin - Muhammed Fatih Uğurlu
      </span>

      <span
        id="my-phone-display"
        style="font-size:12px; opacity:0.9;"
      ></span>

    </div>

    <!-- İSİM BELİRLEME KUTUSU -->
    <div class="profile-name-box">

      <input
        id="my-name-input"
        type="text"
        placeholder="Ekran İsminizi Girin..."
        maxlength="25"
      />

      <button onclick="saveMyName()">
        Kaydet
      </button>

    </div>

    <!-- İSİM YAZMA KISMININ ALTINDAKİ ŞİFRE DEĞİŞTİRME KUTUSU -->
    <div class="profile-password-box">

      <input
        id="old-password-input"
        type="password"
        placeholder="Mevcut Şifre"
        minlength="4"
        maxlength="12"
      />

      <input
        id="new-password-input"
        type="password"
        placeholder="Yeni Şifre (4-12 hane)"
        minlength="4"
        maxlength="12"
      />

      <button onclick="changePassword()">
        Şifreyi Değiştir
      </button>

    </div>


    <div class="add-contact-box">

      <input
        id="new-contact-phone"
        type="tel"
        placeholder="Kişi ekle (05XXXXXXXXX)"
        maxlength="11"
      />

      <button onclick="addNewContact()">
        +
      </button>

    </div>


    <div
      id="contact-list"
      class="contact-list"
    ></div>

  </div>


  <!-- =========================
       SOHBET ALANI
  ========================= -->

  <div class="chat-area">

    <div class="chat-header">

      <div
        class="back-btn"
        onclick="backToContacts()"
      >
        ←
      </div>

      <div>

        <div
          id="active-contact-title"
          class="chat-header-title"
        >
          Sohbet Seçin
        </div>

        <div
          id="active-contact-sub"
          class="chat-header-sub"
        >
          Sol taraftan bir numara seçin
        </div>

      </div>

    </div>


    <div
      id="chat-body"
      class="chat-body"
    >

      <div
        id="system-banner"
        class="system-banner"
        style="display:none;"
      ></div>

      <div
        id="empty-state"
        class="empty-state"
      >
        Mesajlaşmak için bir sohbet seçin
      </div>

    </div>


    <div class="chat-footer">

      <input
        id="message-text"
        placeholder="Bir mesaj yazın..."
        onkeypress="handleKeyPress(event)"
        disabled
      />

      <button
        id="send-btn"
        onclick="sendPigeon()"
        disabled
      >
        🕊️
      </button>

    </div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>

<script>

  /* =========================
     SOCKET
  ========================= */

  const socket = io();


  /* =========================
     DEĞİŞKENLER
  ========================= */

  let myPhone = '';

  let myName = '';

  let activeContact = null;

  let allMessages = [];

  let contacts = new Set();

  let userNamesMap = {};

  let pigeonBusy = false;


  /* =========================
     TELEFON KONTROLÜ
  ========================= */

  function isValidPhone(phone) {

    return /^05[0-9]{9}$/.test(phone);

  }


  /* =========================
     GİRİŞ
  ========================= */

  function login() {

    const phoneInput =
      document.getElementById('my-phone');

    const passInput =
      document.getElementById('my-password');

    const phone =
      phoneInput.value.trim();

    const password =
      passInput.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }

    if (!password || password.length < 4 || password.length > 12) {

      alert(
        'Şifreniz en az 4, en fazla 12 karakter olmalıdır!'
      );

      return;

    }


    myPhone = phone;


    const button =
      document.getElementById('login-button');


    button.disabled = true;

    button.innerText =
      '🇹🇷Fatih"in Güvercini Hazırlanıyor...';


    socket.emit('login', {

      phoneNumber: myPhone,

      password: password

    });

  }


  /* =========================
     İSİM GÜNCELLE VE SAKLA
  ========================= */

  function saveMyName() {

    const nameInput = document.getElementById('my-name-input');
    const newName = nameInput.value.trim();

    if (!newName) {
      alert('Lütfen geçerli bir isim girin!');
      return;
    }

    myName = newName;
    userNamesMap[myPhone] = newName;

    // Cihaz hafızasına yedekle
    localStorage.setItem('pigeon_name_' + myPhone, newName);

    // Sunucuya ve Firebase'e gönder
    socket.emit('update name', {
      name: newName
    });

    alert('İsminiz kalıcı olarak kaydedildi! 🕊️');
    renderContacts();
    if (activeContact) {
      renderActiveChat();
    }
  }


  /* =========================
     ŞİFRE DEĞİŞTİR
  ========================= */

  function changePassword() {

    const oldPassword = document.getElementById('old-password-input').value.trim();
    const newPassword = document.getElementById('new-password-input').value.trim();

    if (!oldPassword) {
      alert('Lütfen mevcut şifrenizi girin!');
      return;
    }

    if (!newPassword || newPassword.length < 4 || newPassword.length > 12) {
      alert('Yeni şifreniz en az 4, en fazla 12 karakter olmalıdır!');
      return;
    }

    socket.emit('change password', {
      oldPassword: oldPassword,
      newPassword: newPassword
    });

  }

  socket.on('password result', function(data) {
    alert(data.message);
    if (data.success) {
      document.getElementById('old-password-input').value = '';
      document.getElementById('new-password-input').value = '';
    }
  });


  /* =========================
     GİRİŞ BAŞARILI
  ========================= */

  socket.on(
    'login success',
    function(data) {

      console.log(
        '✅ Giriş başarılı:',
        data
      );


      document.getElementById(
        'login-overlay'
      ).style.display = 'none';


      document.getElementById(
        'my-phone-display'
      ).innerText =
        data.phoneNumber;


      // Firebase veya yerel hafızadaki ismi al
      const localSavedName = localStorage.getItem('pigeon_name_' + myPhone);
      myName = data.name || localSavedName || myPhone;

      // İsmi girdi kutusuna otomatik yaz
      document.getElementById('my-name-input').value = (myName !== myPhone) ? myName : '';

      userNamesMap = data.userNamesMap || {};
      allMessages = data.history || [];


      allMessages.forEach(
        function(message) {

          const other =
            message.senderPhone === myPhone
              ? message.receiverPhone
              : message.senderPhone;

          if (message.senderPhone && message.senderName) {
            userNamesMap[message.senderPhone] = message.senderName;
          }

          if (other) {

            contacts.add(other);

          }

        }
      );


      renderContacts();


      if (data.pigeonState === 'busy') {

        pigeonBusy = true;

        setSendButtonState(false);

      }

      else {

        pigeonBusy = false;

      }

    }
  );


  /* =========================
     KULLANICI İSMİ GÜNCELLENDİ
  ========================= */

  socket.on('user name updated', function(data) {
    userNamesMap[data.phoneNumber] = data.name;
    renderContacts();
    if (activeContact === data.phoneNumber) {
      document.getElementById('active-contact-title').innerText = `${data.name} (${data.phoneNumber})`;
      renderActiveChat();
    }
  });


  /* =========================
     GİRİŞ HATASI
  ========================= */

  socket.on(
    'login error',
    function(data) {

      const button = document.getElementById('login-button');
      button.disabled = false;
      button.innerText = 'Giriş Yap / Kayıt Ol';

      alert(
        data.message || 'Giriş başarısız.'
      );

    }
  );

  socket.on(
    'login failed',
    function(data) {

      const button = document.getElementById('login-button');
      button.disabled = false;
      button.innerText = 'Giriş Yap / Kayıt Ol';

      alert(
        data.message || 'Giriş başarısız.'
      );

    }
  );


  /* =========================
     GÜVERCİN HATASI
  ========================= */

  socket.on(
    'pigeon error',
    function(data) {

      pigeonBusy = false;

      setSendButtonState(true);

      alert(
        data.message
      );

    }
  );


  /* =========================
     KİŞİ EKLE
  ========================= */

  function addNewContact() {

    const input =
      document.getElementById(
        'new-contact-phone'
      );


    const phone =
      input.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }


    if (phone === myPhone) {

      alert(
        'Kendi numaranızı ekleyemezsiniz!'
      );

      return;

    }


    contacts.add(phone);


    input.value = '';


    renderContacts();

    selectContact(phone);

  }


  /* =========================
     KİŞİLERİ GÖSTER
  ========================= */

  function renderContacts() {

    const list =
      document.getElementById(
        'contact-list'
      );


    list.innerHTML = '';


    contacts.forEach(
      function(phone) {

        const displayName = userNamesMap[phone] || phone;

        const item =
          document.createElement('div');


        item.className =
          `contact-item ${
            phone === activeContact
              ? 'active'
              : ''
          }`;


        item.onclick =
          function() {

            selectContact(phone);

          };


        const lastMsg =
          allMessages

            .filter(
              function(message) {

                return (

                  (
                    message.senderPhone === myPhone &&
                    message.receiverPhone === phone
                  )

                  ||

                  (
                    message.senderPhone === phone &&
                    message.receiverPhone === myPhone
                  )

                );

              }
            )

            .pop();


        item.innerHTML = `

          <div class="contact-name">
            ${escapeHtml(displayName)}
          </div>

          <div class="contact-phone">
            ${escapeHtml(phone)}
          </div>

          <div class="contact-last-msg">
            ${
              lastMsg
                ? escapeHtml(lastMsg.message)
                : 'Henüz mesaj yok'
            }
          </div>

        `;


        list.appendChild(item);

      }
    );

  }


  /* =========================
     SOHBET SEÇ
  ========================= */

  function selectContact(phone) {

    activeContact = phone;

    const displayName = userNamesMap[phone] || phone;

    document.getElementById(
      'active-contact-title'
    ).innerText = `${displayName} (${phone})`;


    document.getElementById(
      'active-contact-sub'
    ).innerText =
      '🕊️ Güvercin Postası Aktif';


    document.getElementById(
      'message-text'
    ).disabled = false;


    if (!pigeonBusy) {

      document.getElementById(
        'send-btn'
      ).disabled = false;

    }


    document.getElementById(
      'app-container'
    ).classList.add('show-chat');


    renderContacts();

    renderActiveChat();

  }


  /* =========================
     GERİ
  ========================= */

  function backToContacts() {

    document.getElementById(
      'app-container'
    ).classList.remove(
      'show-chat'
    );

  }


  /* =========================
     SOHBETİ GÖSTER
  ========================= */

  function renderActiveChat() {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    chatBody.innerHTML = `

      <div
        id="system-banner"
        class="system-banner"
        style="display:none;"
      ></div>

    `;


    if (!activeContact) {

      chatBody.innerHTML += `

        <div
          id="empty-state"
          class="empty-state"
        >
          Mesajlaşmak için bir sohbet seçin
        </div>

      `;

      return;

    }


    const filtered =
      allMessages.filter(
        function(message) {

          return (

            (
              message.senderPhone === myPhone &&
              message.receiverPhone === activeContact
            )

            ||

            (
              message.senderPhone === activeContact &&
              message.receiverPhone === myPhone
            )

          );

        }
      );


    filtered.forEach(
      appendMessageToBody
    );

  }


  /* =========================
     MESAJ GÖSTER
  ========================= */

  function appendMessageToBody(msg) {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    const emptyState =
      document.getElementById(
        'empty-state'
      );


    if (emptyState) {

      emptyState.remove();

    }


    const isOutgoing =
      msg.senderPhone === myPhone;

    const senderDisplayName = msg.senderName || userNamesMap[msg.senderPhone] || msg.senderPhone;

    const bubble =
      document.createElement('div');


    bubble.className =
      `msg-bubble ${
        isOutgoing
          ? 'msg-outgoing'
          : 'msg-incoming'
      }`;


    bubble.innerHTML = `

      <div class="msg-sender-name">${isOutgoing ? '(Siz)' : escapeHtml(senderDisplayName)}</div>

      <div>
        ${escapeHtml(msg.message)}
      </div>

      <div class="msg-info">

        <span>
          ${escapeHtml(
            String(msg.time)
          )}
        </span>

        

      </div>

    `;


    chatBody.appendChild(
      bubble
    );


    chatBody.scrollTop =
      chatBody.scrollHeight;

  }


  /* =========================
     GÜVERCİN GÖNDER
  ========================= */

  function sendPigeon() {

    if (!activeContact) {

      alert(
        'Lütfen sohbet edilecek kişiyi seçin!'
      );

      return;

    }


    if (pigeonBusy) {

      alert(
        'Güvercinin şu anda yolda! 🕊️'
      );

      return;

    }


    const messageInput =
      document.getElementById(
        'message-text'
      );


    const message =
      messageInput.value.trim();


    if (!message) {

      return;

    }


    socket.emit(
      'send pigeon',
      {

        senderPhone: myPhone,

        receiverPhone: activeContact,

        message: message

      }
    );


    messageInput.value = '';

  }


  /* =========================
     ENTER
  ========================= */

  function handleKeyPress(e) {

    if (e.key === 'Enter') {

      sendPigeon();

    }

  }


  /* =========================
     BUTON DURUMU
  ========================= */

  function setSendButtonState(enabled) {

    const button =
      document.getElementById(
        'send-btn'
      );


    button.disabled =
      !enabled;

  }


  /* =========================
     GÜVERCİN YOLA ÇIKTI
  ========================= */

  socket.on(
    'pigeon status',
    function(data) {

      console.log(
        '🕊️ Güvercin yola çıktı:',
        data
      );


      allMessages.push(
        data.messageData
      );


      if (
        activeContact ===
        data.receiverPhone
      ) {

        appendMessageToBody(
          data.messageData
        );

      }


      renderContacts();


      pigeonBusy = true;

      setSendButtonState(false);


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (!banner) {
        return;
      }


      banner.style.display =
        'block';


      let timeLeft =
        data.flightTimeInSeconds;


      function updateTimer() {

        if (timeLeft <= 0) {

          banner.innerText =
            `🕊️ Güvercin teslimat noktasına ulaştı.`;

          return;

        }


        const minutes =
          Math.floor(
            timeLeft / 60
          );


        const seconds =
          timeLeft % 60;


        let remainingText;


        if (minutes > 0) {

          remainingText =
            `${minutes} dk ${seconds} sn`;

        }

        else {

          remainingText =
            `${seconds} sn`;

        }


        banner.innerText =
          `🕊️ Güvercin yolda... ` +
          `Kalan: ${remainingText}`;


        timeLeft--;

        setTimeout(
          updateTimer,
          1000
        );

      }


      updateTimer();

    }
  );


  /* =========================
     TESLİM EDİLDİ
  ========================= */

  socket.on(
    'pigeon delivered',
    function(data) {

      pigeonBusy = false;


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (banner) {

        banner.innerText =
          data.message;

        banner.style.display =
          'block';

      }


      setSendButtonState(
        activeContact !== null
      );


      setTimeout(
        function() {

          if (banner) {

            banner.style.display =
              'none';

          }

        },
        4000
      );

    }
  );


  /* =========================
     GÜVERCİN GELDİ
  ========================= */

  socket.on(
    'pigeon arrived',
    function(msgData) {

      console.log(
        '📬 Mesaj geldi:',
        msgData
      );


      allMessages.push(
        msgData
      );


      if (msgData.senderName) {
        userNamesMap[msgData.senderPhone] = msgData.senderName;
      }


      contacts.add(
        msgData.senderPhone
      );


      if (
        activeContact ===
        msgData.senderPhone
      ) {

        appendMessageToBody(
          msgData
        );

      }


      renderContacts();

    }
  );


  /* =========================
     GÜVENLİ HTML
  ========================= */

  function escapeHtml(value) {

    return String(value)

      .replaceAll('&', '&amp;')

      .replaceAll('<', '&lt;')

      .replaceAll('>', '&gt;')

      .replaceAll('"', '&quot;')

      .replaceAll("'", '&#039;');

  }


  /* =========================
     TELEFONDAN ENTER
  ========================= */

  document
    .getElementById('my-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          login();

        }

      }
    );

  document
    .getElementById('my-password')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          login();

        }

      }
    );


  document
    .getElementById('new-contact-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          addNewContact();

        }

      }
    );


  document
    .getElementById('my-name-input')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          saveMyName();

        }

      }
    );

</script>

</body>
