<script>

  /* =========================
     SOCKET
  ========================= */

  const socket = io();


  /* =========================
     DEĞİŞKENLER
  ========================= */

  let myPhone = '';

  let activeContact = null;

  let allMessages = [];

  let contacts = new Set();

  let pigeonBusy = false;


  /* =========================
     TELEFON KONTROLÜ
  ========================= */

  function isValidPhone(phone) {

    return /^05[0-9]{9}$/.test(phone);

  }


  /* =========================
     GİRİŞ
  ========================= */

  function login() {

    const input =
      document.getElementById('my-phone');

    const phone =
      input.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }


    myPhone = phone;


    const status =
      document.getElementById('location-status');

    const button =
      document.getElementById('login-button');


    button.disabled = true;

    button.innerText =
      'Fatihin Güvercini hazırlanıyor...';


    status.innerText =
      '✅ Giriş yapılıyor...';


    /* =========================
       KONUM YOK
    ========================= */

    socket.emit('login', {

      phoneNumber: myPhone

    });

  }


  /* =========================
     GİRİŞ BAŞARILI
  ========================= */

  socket.on(
    'login success',
    function(data) {

      console.log(
        '✅ Giriş başarılı:',
        data
      );


      document.getElementById(
        'login-overlay'
      ).style.display = 'none';


      document.getElementById(
        'my-phone-display'
      ).innerText =
        data.phoneNumber;


      allMessages =
        data.history || [];


      /* =========================
         MESAJLARDAN KİŞİLERİ BUL
      ========================= */

      allMessages.forEach(
        function(message) {

          const other =
            message.senderPhone === myPhone
              ? message.receiverPhone
              : message.senderPhone;


          if (other) {

            contacts.add(other);

          }

        }
      );


      renderContacts();


      if (data.pigeonState === 'busy') {

        pigeonBusy = true;

        setSendButtonState(false);

      }

      else {

        pigeonBusy = false;

      }

    }
  );


  /* =========================
     GİRİŞ HATASI
  ========================= */

  socket.on(
    'login failed',
    function(data) {

      const button =
        document.getElementById('login-button');

      const status =
        document.getElementById('location-status');


      button.disabled = false;

      button.innerText =
        'Giriş Yap';


      status.innerText =
        '🇹🇷 Muhammed Fatih Uğurlu 🇹🇷';


      alert(
        data.message || 'Giriş başarısız.'
      );

    }
  );


  /* =========================
     GÜVERCİN HATASI
  ========================= */

  socket.on(
    'pigeon error',
    function(data) {

      pigeonBusy = false;

      setSendButtonState(true);

      alert(
        data.message
      );

    }
  );


  /* =========================
     KİŞİ EKLE
  ========================= */

  function addNewContact() {

    const input =
      document.getElementById(
        'new-contact-phone'
      );


    const phone =
      input.value.trim();


    if (!isValidPhone(phone)) {

      alert(
        'Geçerli numara girin!\n\nÖrnek: 05551112233'
      );

      return;

    }


    if (phone === myPhone) {

      alert(
        'Kendi numaranızı ekleyemezsiniz!'
      );

      return;

    }


    contacts.add(phone);


    input.value = '';


    renderContacts();

    selectContact(phone);

  }


  /* =========================
     KİŞİLERİ GÖSTER
  ========================= */

  function renderContacts() {

    const list =
      document.getElementById(
        'contact-list'
      );


    list.innerHTML = '';


    contacts.forEach(
      function(phone) {

        const item =
          document.createElement('div');


        item.className =
          `contact-item ${
            phone === activeContact
              ? 'active'
              : ''
          }`;


        item.onclick =
          function() {

            selectContact(phone);

          };


        const lastMsg =
          allMessages

            .filter(
              function(message) {

                return (

                  (
                    message.senderPhone === myPhone &&
                    message.receiverPhone === phone
                  )

                  ||

                  (
                    message.senderPhone === phone &&
                    message.receiverPhone === myPhone
                  )

                );

              }
            )

            .pop();


        item.innerHTML = `

          <div class="contact-phone">
            ${escapeHtml(phone)}
          </div>

          <div class="contact-last-msg">
            ${
              lastMsg
                ? escapeHtml(lastMsg.message)
                : 'Henüz mesaj yok'
            }
          </div>

        `;


        list.appendChild(item);

      }
    );

  }


  /* =========================
     SOHBET SEÇ
  ========================= */

  function selectContact(phone) {

    activeContact = phone;


    document.getElementById(
      'active-contact-title'
    ).innerText = phone;


    document.getElementById(
      'active-contact-sub'
    ).innerText =
      '🕊️ Güvercin Postası Aktif';


    document.getElementById(
      'message-text'
    ).disabled = false;


    if (!pigeonBusy) {

      document.getElementById(
        'send-btn'
      ).disabled = false;

    }


    document.getElementById(
      'app-container'
    ).classList.add('show-chat');


    renderContacts();

    renderActiveChat();

  }


  /* =========================
     GERİ
  ========================= */

  function backToContacts() {

    document.getElementById(
      'app-container'
    ).classList.remove(
      'show-chat'
    );

  }


  /* =========================
     SOHBETİ GÖSTER
  ========================= */

  function renderActiveChat() {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    chatBody.innerHTML = `

      <div
        id="system-banner"
        class="system-banner"
        style="display:none;"
      ></div>

    `;


    if (!activeContact) {

      chatBody.innerHTML += `

        <div
          id="empty-state"
          class="empty-state"
        >
          Mesajlaşmak için bir sohbet seçin
        </div>

      `;

      return;

    }


    const filtered =
      allMessages.filter(
        function(message) {

          return (

            (
              message.senderPhone === myPhone &&
              message.receiverPhone === activeContact
            )

            ||

            (
              message.senderPhone === activeContact &&
              message.receiverPhone === myPhone
            )

          );

        }
      );


    filtered.forEach(
      appendMessageToBody
    );

  }


  /* =========================
     MESAJ GÖSTER
  ========================= */

  function appendMessageToBody(msg) {

    const chatBody =
      document.getElementById(
        'chat-body'
      );


    const emptyState =
      document.getElementById(
        'empty-state'
      );


    if (emptyState) {

      emptyState.remove();

    }


    const isOutgoing =
      msg.senderPhone === myPhone;


    const bubble =
      document.createElement('div');


    bubble.className =
      `msg-bubble ${
        isOutgoing
          ? 'msg-outgoing'
          : 'msg-incoming'
      }`;


    bubble.innerHTML = `

      <div>
        ${escapeHtml(msg.message)}
      </div>

      <div class="msg-info">

        <span>
          ${escapeHtml(
            String(msg.time)
          )}
        </span>

        ${
          isOutgoing
            ? '<span>🕊️</span>'
            : ''
        }

      </div>

    `;


    chatBody.appendChild(
      bubble
    );


    chatBody.scrollTop =
      chatBody.scrollHeight;

  }


  /* =========================
     GÜVERCİN GÖNDER
  ========================= */

  function sendPigeon() {

    if (!activeContact) {

      alert(
        'Lütfen sohbet edilecek kişiyi seçin!'
      );

      return;

    }


    if (pigeonBusy) {

      alert(
        'Güvercinin şu anda yolda! 🕊️'
      );

      return;

    }


    const messageInput =
      document.getElementById(
        'message-text'
      );


    const message =
      messageInput.value.trim();


    if (!message) {

      return;

    }


    /* =========================
       SUNUCUYA MESAJ
       KONUM YOK
    ========================= */

    socket.emit(
      'send pigeon',
      {

        senderPhone: myPhone,

        receiverPhone: activeContact,

        message: message

      }
    );


    messageInput.value = '';

  }


  /* =========================
     ENTER
  ========================= */

  function handleKeyPress(e) {

    if (e.key === 'Enter') {

      sendPigeon();

    }

  }


  /* =========================
     BUTON DURUMU
  ========================= */

  function setSendButtonState(enabled) {

    const button =
      document.getElementById(
        'send-btn'
      );


    button.disabled =
      !enabled;

  }


  /* =========================
     GÜVERCİN YOLA ÇIKTI
  ========================= */

  socket.on(
    'pigeon status',
    function(data) {

      console.log(
        '🕊️ Güvercin yola çıktı:',
        data
      );


      allMessages.push(
        data.messageData
      );


      if (
        activeContact ===
        data.receiverPhone
      ) {

        appendMessageToBody(
          data.messageData
        );

      }


      renderContacts();


      pigeonBusy = true;

      setSendButtonState(false);


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (!banner) {
        return;
      }


      banner.style.display =
        'block';


      let timeLeft =
        data.flightTimeInSeconds || 0;


      function updateTimer() {

        if (timeLeft <= 0) {

          banner.innerText =
            '🕊️ Güvercin teslimat noktasına ulaştı.';

          return;

        }


        const minutes =
          Math.floor(
            timeLeft / 60
          );


        const seconds =
          timeLeft % 60;


        let remainingText;


        if (minutes > 0) {

          remainingText =
            `${minutes} dk ${seconds} sn`;

        }

        else {

          remainingText =
            `${seconds} sn`;

        }


        banner.innerText =
          `🕊️ Güvercin yolda... ` +
          `Kalan: ${remainingText}`;


        timeLeft--;


        setTimeout(
          updateTimer,
          1000
        );

      }


      updateTimer();

    }
  );


  /* =========================
     TESLİM EDİLDİ
  ========================= */

  socket.on(
    'pigeon delivered',
    function(data) {

      pigeonBusy = false;


      const banner =
        document.getElementById(
          'system-banner'
        );


      if (banner) {

        banner.innerText =
          data.message;

        banner.style.display =
          'block';

      }


      setSendButtonState(
        activeContact !== null
      );


      setTimeout(
        function() {

          if (banner) {

            banner.style.display =
              'none';

          }

        },
        4000
      );

    }
  );


  /* =========================
     GÜVERCİN GELDİ
  ========================= */

  socket.on(
    'pigeon arrived',
    function(msgData) {

      console.log(
        '📬 Mesaj geldi:',
        msgData
      );


      allMessages.push(
        msgData
      );


      contacts.add(
        msgData.senderPhone
      );


      if (
        activeContact ===
        msgData.senderPhone
      ) {

        appendMessageToBody(
          msgData
        );

      }


      renderContacts();

    }
  );


  /* =========================
     GÜVENLİ HTML
  ========================= */

  function escapeHtml(value) {

    return String(value)

      .replaceAll('&', '&amp;')

      .replaceAll('<', '&lt;')

      .replaceAll('>', '&gt;')

      .replaceAll('"', '&quot;')

      .replaceAll("'", '&#039;');

  }


  /* =========================
     TELEFONDAN ENTER
  ========================= */

  document
    .getElementById('my-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          login();

        }

      }
    );


  document
    .getElementById('new-contact-phone')
    .addEventListener(
      'keypress',
      function(e) {

        if (e.key === 'Enter') {

          addNewContact();

        }

      }
    );


</script>
